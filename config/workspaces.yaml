# Which Refunnel workspaces this pipeline knows about, and whether each
# one runs automatically on the daily schedule.
#
# To turn scheduled runs on/off for a workspace: change schedule_enabled
# below and commit. Every workspace can always be run manually regardless
# of this setting (via the Actions tab -> Run workflow -> pick a
# workspace), matching "off by default, manual anytime."
#
# spreadsheet_id_secret must match a real GitHub Actions secret name
# holding that workspace's target Refunnel-export Google Sheet ID.
#
# tracker_spreadsheet_id_secret is the SAME idea for that workspace's
# Content Tracker -- a completely separate spreadsheet per brand, not a
# shared tracker sheet with one tab per brand. Confirmed real want:
# each brand gets its own dedicated Content Tracker sheet. Duderobe's
# value points at the tracker sheet already in use today (nothing
# changes for it); a brand with this left unset is skipped for Content
# Tracker the same way an unset spreadsheet_id_secret already skips it
# for the main export.

# drive_folder_id_secret is the target Google Drive folder's real
# Drive API id (used to search for and rename the file Refunnel's own
# native upload creates) for that brand's Approved-video backfill
# (download_approved_to_drive.py). Confirmed real want: Duderobe
# doesn't need this right now, only Swoveralls -- a brand missing this
# is skipped cleanly for the Drive backfill only, same "not set up
# yet" pattern as everything else.
#
# drive_folder_name is the SAME folder's name as shown in Refunnel's
# own "All folders" picker (confirmed real, exact name from a live
# screenshot: "Refunnel - Swoveralls") -- not a secret, since a folder
# name isn't sensitive. Defaults to "Refunnel - <brand name>" if left
# unset, which already matches the confirmed real pattern; set
# explicitly only if a brand's folder is named differently.

workspaces:
  - name: Duderobe
    refunnel_workspace_name: Duderobe
    spreadsheet_id_secret: SPREADSHEET_ID_DUDEROBE
    tracker_spreadsheet_id_secret: CONTENT_TRACKER_SPREADSHEET_ID_DUDEROBE
    schedule_enabled: true

  - name: Swoveralls
    refunnel_workspace_name: Swoveralls
    spreadsheet_id_secret: SPREADSHEET_ID_SWOVERALLS
    tracker_spreadsheet_id_secret: CONTENT_TRACKER_SPREADSHEET_ID_SWOVERALLS
    drive_folder_id_secret: DRIVE_FOLDER_ID_SWOVERALLS
    drive_folder_name: "Refunnel - Swoveralls"
    schedule_enabled: true

  - name: Defi Snacks
    refunnel_workspace_name: Defi Snacks
    spreadsheet_id_secret: SPREADSHEET_ID_DEFI_SNACKS
    tracker_spreadsheet_id_secret: CONTENT_TRACKER_SPREADSHEET_ID_DEFI_SNACKS
    schedule_enabled: false

  - name: Kelson
    refunnel_workspace_name: Kelson
    spreadsheet_id_secret: SPREADSHEET_ID_KELSON
    tracker_spreadsheet_id_secret: CONTENT_TRACKER_SPREADSHEET_ID_KELSON
    schedule_enabled: false
