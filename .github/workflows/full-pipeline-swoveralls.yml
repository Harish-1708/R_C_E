name: Full Pipeline - Swoveralls

# Swoveralls's own dedicated export-and-emails run, on its own
# schedule window -- separate from the OTHER brand's window and from
# the combined full-pipeline.yml, which handles campaign sync and
# Drive backfill for every brand on their own separate schedules
# already (campaign-sync.yml, drive-backfill.yml).
#
# CONFIRMED REAL need for this split: Swoveralls alone -- ~5,900
# posts, a browser crash roughly every 150-475 items during email
# scraping -- can take longer than GitHub's 6-hour hard job cap to get
# through in one pass. Sharing one combined schedule with Duderobe
# meant whichever brand ran first could eat the whole window, leaving
# the other starved. Each brand now gets its own full, independent
# window -- Swoveralls here, the other brand 12 hours apart.
#
# Includes campaign tagging and Drive backfill too, same as the
# original combined full-pipeline.yml -- Swoveralls is the brand that
# actually uses Drive backfill (config/workspaces.yaml has no
# drive_folder_id_secret for Duderobe, so it's skipped cleanly there
# regardless of which workflow triggers it).
#
# HONEST CAVEAT: sync_campaigns.py and download_approved_to_drive.py
# both loop over EVERY brand in config/workspaces.yaml themselves --
# neither script currently supports narrowing to just one brand. So
# this job processes every configured brand's campaigns/Drive, not
# only Swoveralls's, the same way the original combined workflow did.
# The standalone campaign-sync.yml and drive-backfill.yml workflows
# still run on their own separate daily schedules too -- worth
# disabling one set or the other if you don't want both running.
on:
  schedule:
    - cron: "0 0 * * *"  # Swoveralls's own 12-hour window
  workflow_dispatch:
    inputs:
      workspace:
        description: "Always Swoveralls -- this workflow is pinned to it (see WORKSPACE_INPUT below)."
        required: false
        default: "Swoveralls"
        type: string
      scrape_budget_minutes:
        description: "Minutes allowed for email scraping before handing off to later phases."
        required: false
        default: "150"
        type: string
      drive_batch_size:
        description: "Max Approved videos to save to Drive this run."
        required: false
        default: "50"
        type: string

jobs:
  determine-workspaces:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: set-matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKSPACE_INPUT: "Swoveralls"  # pinned -- always this one brand, scheduled or manual
        run: |
          MATRIX=$(python scripts/determine_workspaces.py)
          echo "Selected workspaces: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # --- Phases 1 + 3: export everything, then scrape emails ---
  export-and-emails:
    needs: determine-workspaces
    if: needs.determine-workspaces.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Load-bearing, not a perf setting: all workspaces share ONE
      # Refunnel login and an OTP code is single-use.
      max-parallel: 1
      matrix:
        workspace: ${{ fromJson(needs.determine-workspaces.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Restore saved Refunnel session
        uses: actions/cache/restore@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}
          restore-keys: |
            refunnel-session-

      - name: Seed session from bootstrap secret if there is no cached one
        env:
          INITIAL_REFUNNEL_SESSION_B64: ${{ secrets.INITIAL_REFUNNEL_SESSION_B64 }}
        run: |
          if [ -f refunnel_session.json ]; then
            echo "Using the cached session."
          elif [ -n "$INITIAL_REFUNNEL_SESSION_B64" ]; then
            echo "$INITIAL_REFUNNEL_SESSION_B64" | base64 -d > refunnel_session.json
            echo "Seeded session from INITIAL_REFUNNEL_SESSION_B64 secret."
          else
            echo "No cached session and no bootstrap secret -- will fall back to a fresh Gmail-OTP login."
          fi

      - name: "Phase 1 - Export all media (${{ matrix.workspace.name }})"
        env:
          PIPELINE_PHASE: "1"
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          WORKSPACE_NAME: ${{ matrix.workspace.name }}
          REFUNNEL_WORKSPACE_NAME: ${{ matrix.workspace.refunnel_workspace_name }}
          KNOWN_WORKSPACE_NAMES: "Duderobe,Swoveralls,Defi Snacks,Kelson"
          SPREADSHEET_ID: ${{ secrets[matrix.workspace.spreadsheet_id_secret] }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > service_account.json
          python -u run_daily_sync.py

      # No `if: always()` here, deliberately: Phase 3 re-does its own
      # independent login/navigate/export (see run_daily_sync.py's
      # _setup_and_parse_media docstring), so if Phase 1 genuinely
      # failed -- bad credentials, Refunnel down -- Phase 3 would just
      # hit the exact same failure again. Skipping it when Phase 1
      # failed matches main()'s own in-process behavior for anyone
      # still running both phases together by hand.
      - name: "Phase 3 - Scrape creator emails (${{ matrix.workspace.name }})"
        env:
          PIPELINE_PHASE: "3"
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          WORKSPACE_NAME: ${{ matrix.workspace.name }}
          REFUNNEL_WORKSPACE_NAME: ${{ matrix.workspace.refunnel_workspace_name }}
          KNOWN_WORKSPACE_NAMES: "Duderobe,Swoveralls,Defi Snacks,Kelson"
          SPREADSHEET_ID: ${{ secrets[matrix.workspace.spreadsheet_id_secret] }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCRAPE_TIME_BUDGET_MINUTES: ${{ github.event.inputs.scrape_budget_minutes || '150' }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > service_account.json
          python -u run_daily_sync.py

      - name: Save Refunnel session for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-export-emails-${{ matrix.workspace.name }}-${{ github.run_id }}
          path: downloads/
          retention-days: 7
          if-no-files-found: ignore

  # --- Phases 2 + 4: campaign tagging, then Approved videos to Drive ---
  # One job, because both of these scripts iterate every brand in
  # config/workspaces.yaml themselves. `if: always()` so a failure in an
  # earlier phase never silently cancels these.
  campaigns-and-drive:
    needs: export-and-emails
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Restore saved Refunnel session
        uses: actions/cache/restore@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}
          restore-keys: |
            refunnel-session-

      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > service_account.json

      - name: "Phase 2 - Tag posts with their campaign"
        if: always()
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPREADSHEET_ID_DUDEROBE: ${{ secrets.SPREADSHEET_ID_DUDEROBE }}
          SPREADSHEET_ID_SWOVERALLS: ${{ secrets.SPREADSHEET_ID_SWOVERALLS }}
          SPREADSHEET_ID_DEFI_SNACKS: ${{ secrets.SPREADSHEET_ID_DEFI_SNACKS }}
          SPREADSHEET_ID_KELSON: ${{ secrets.SPREADSHEET_ID_KELSON }}
        run: python -u sync_campaigns.py

      - name: "Phase 4 - Save Approved videos to Google Drive"
        if: always()
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPREADSHEET_ID_DUDEROBE: ${{ secrets.SPREADSHEET_ID_DUDEROBE }}
          SPREADSHEET_ID_SWOVERALLS: ${{ secrets.SPREADSHEET_ID_SWOVERALLS }}
          DRIVE_FOLDER_ID_SWOVERALLS: ${{ secrets.DRIVE_FOLDER_ID_SWOVERALLS }}
          DRIVE_BACKFILL_BATCH_SIZE: ${{ github.event.inputs.drive_batch_size || '50' }}
        run: python -u download_approved_to_drive.py

      - name: Save Refunnel session for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}-phase24

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-campaigns-drive-${{ github.run_id }}
          path: downloads/
          retention-days: 7
          if-no-files-found: ignore
