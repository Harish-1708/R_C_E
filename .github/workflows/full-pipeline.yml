name: Full Pipeline

# Runs the whole chain in ONE job, in the explicitly requested order:
#   1. Export all media  -> Master Data (new rows added, existing updated)
#   2. Campaign sync     -> tag each post with its campaign (freeze-once-set)
#   3. Email scraping    -> live, incremental, as before
#   4. Drive backfill    -> Approved videos only, saved live, skipped once saved
#
# EVERY phase is independently resumable and skips work already done,
# so a phase that runs out of time simply continues on the next run.
# Nothing is ever lost or duplicated by a phase being cut short.
#
# PER-PHASE TIME BUDGETS are the load-bearing part of this design.
# Email scraping alone has hours of backlog for Swoveralls; without a
# budget it would consume the entire job and phases 2 and 4 would
# never run at all. Each phase therefore gets its own guaranteed
# slice, tuned so the whole job finishes inside the timeout below.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      scrape_budget_minutes:
        description: "Minutes allowed for email scraping before moving on to the Drive phase."
        required: false
        default: "150"
        type: string
      drive_batch_size:
        description: "Max Approved videos to save to Drive this run."
        required: false
        default: "50"
        type: string

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Under GitHub's 6-hour hard cap -- confirmed real: a live run was
    # cancelled outright at that cap mid-scrape, losing the sheet
    # writes that only happen after scraping.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright's browser
        run: python -m playwright install --with-deps chromium

      - name: Restore saved Refunnel session
        uses: actions/cache/restore@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}
          restore-keys: |
            refunnel-session-

      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > service_account.json

      # --- Phase 1 + 3: export, then email scraping (same script) ---
      # run_daily_sync.py already does the full export FIRST (writing
      # Master Data before scraping starts) and then scrapes emails
      # live, so these two requested phases are one invocation.
      - name: "Phase 1+3 - Export all media, then scrape emails"
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPREADSHEET_ID_DUDEROBE: ${{ secrets.SPREADSHEET_ID_DUDEROBE }}
          SPREADSHEET_ID_SWOVERALLS: ${{ secrets.SPREADSHEET_ID_SWOVERALLS }}
          SPREADSHEET_ID_DEFI_SNACKS: ${{ secrets.SPREADSHEET_ID_DEFI_SNACKS }}
          SPREADSHEET_ID_KELSON: ${{ secrets.SPREADSHEET_ID_KELSON }}
          SCRAPE_TIME_BUDGET_MINUTES: ${{ github.event.inputs.scrape_budget_minutes || '150' }}
        run: python -u run_daily_sync.py

      # --- Phase 2: campaign tagging ---
      # if: always() so a problem in an earlier phase never silently
      # cancels the remaining ones -- each phase stands on its own.
      - name: "Phase 2 - Tag posts with their campaign"
        if: always()
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPREADSHEET_ID_DUDEROBE: ${{ secrets.SPREADSHEET_ID_DUDEROBE }}
          SPREADSHEET_ID_SWOVERALLS: ${{ secrets.SPREADSHEET_ID_SWOVERALLS }}
          SPREADSHEET_ID_DEFI_SNACKS: ${{ secrets.SPREADSHEET_ID_DEFI_SNACKS }}
          SPREADSHEET_ID_KELSON: ${{ secrets.SPREADSHEET_ID_KELSON }}
        run: python -u sync_campaigns.py

      # --- Phase 4: Approved videos -> Google Drive ---
      - name: "Phase 4 - Save Approved videos to Google Drive"
        if: always()
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPREADSHEET_ID_DUDEROBE: ${{ secrets.SPREADSHEET_ID_DUDEROBE }}
          SPREADSHEET_ID_SWOVERALLS: ${{ secrets.SPREADSHEET_ID_SWOVERALLS }}
          DRIVE_FOLDER_ID_SWOVERALLS: ${{ secrets.DRIVE_FOLDER_ID_SWOVERALLS }}
          DRIVE_BACKFILL_BATCH_SIZE: ${{ github.event.inputs.drive_batch_size || '50' }}
        run: python -u download_approved_to_drive.py

      - name: Save Refunnel session for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-pipeline-debug-${{ github.run_id }}
          path: downloads/
          retention-days: 7
          if-no-files-found: ignore
