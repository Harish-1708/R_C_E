name: Full Pipeline

# Runs the whole chain in the explicitly requested order:
#   1. Export all media  -> Master Data (new rows added, existing updated)
#   3. Email scraping    -> live, incremental
#      (1 and 3 are ONE script: run_daily_sync.py writes Master Data
#       fully BEFORE scraping starts, so the export is already complete
#       and safe even if scraping is later cut short.)
#   2. Campaign sync     -> tag each post with its campaign (freeze-once-set)
#   4. Drive backfill    -> Approved videos only, saved live, skipped once saved
#
# STRUCTURE, and why it is not one flat job -- confirmed real bug in an
# earlier version of this file: run_daily_sync.py is a PER-WORKSPACE
# script. It reads a single SPREADSHEET_ID plus WORKSPACE_NAME, and is
# driven by a build matrix, one job per brand. sync_campaigns.py and
# download_approved_to_drive.py are the opposite -- they loop over every
# brand in config/workspaces.yaml themselves. Passing the per-brand
# secrets (SPREADSHEET_ID_DUDEROBE etc.) to run_daily_sync.py made it
# fail instantly with "Missing required env vars", which is exactly what
# a live run showed. So: a matrix job for phase 1+3, then a single
# follow-up job for phases 2 and 4.
#
# Every phase is independently resumable and skips work already done, so
# a phase cut short simply continues next run. Nothing is lost or
# duplicated.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      workspace:
        description: '"all-enabled" (default), "all", or an exact workspace name.'
        required: false
        default: all-enabled
        type: string
      scrape_budget_minutes:
        description: "Minutes allowed for email scraping before handing off to later phases."
        required: false
        default: "150"
        type: string
      drive_batch_size:
        description: "Max Approved videos to save to Drive this run."
        required: false
        default: "50"
        type: string
      scrape_max_posts:
        description: "Smoke test: max posts to scrape emails for this run (e.g. 25). Blank = no cap."
        required: false
        default: ""
        type: string

jobs:
  determine-workspaces:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - id: set-matrix
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKSPACE_INPUT: ${{ github.event.inputs.workspace }}
        run: |
          MATRIX=$(python scripts/determine_workspaces.py)
          echo "Selected workspaces: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  # --- Phases 1 + 3: export everything, then scrape emails ---
  export-and-emails:
    needs: determine-workspaces
    if: needs.determine-workspaces.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Load-bearing, not a perf setting: all workspaces share ONE
      # Refunnel login and an OTP code is single-use.
      max-parallel: 1
      matrix:
        workspace: ${{ fromJson(needs.determine-workspaces.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Restore saved Refunnel session
        uses: actions/cache/restore@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}
          restore-keys: |
            refunnel-session-

      - name: Seed session from bootstrap secret if there is no cached one
        env:
          INITIAL_REFUNNEL_SESSION_B64: ${{ secrets.INITIAL_REFUNNEL_SESSION_B64 }}
        run: |
          if [ -f refunnel_session.json ]; then
            echo "Using the cached session."
          elif [ -n "$INITIAL_REFUNNEL_SESSION_B64" ]; then
            echo "$INITIAL_REFUNNEL_SESSION_B64" | base64 -d > refunnel_session.json
            echo "Seeded session from INITIAL_REFUNNEL_SESSION_B64 secret."
          else
            echo "No cached session and no bootstrap secret -- will fall back to a fresh Gmail-OTP login."
          fi

      - name: "Phases 1+3 - Export all media, then scrape emails (${{ matrix.workspace.name }})"
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          WORKSPACE_NAME: ${{ matrix.workspace.name }}
          REFUNNEL_WORKSPACE_NAME: ${{ matrix.workspace.refunnel_workspace_name }}
          KNOWN_WORKSPACE_NAMES: "Duderobe,Swoveralls,Defi Snacks,Kelson"
          SPREADSHEET_ID: ${{ secrets[matrix.workspace.spreadsheet_id_secret] }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SCRAPE_TIME_BUDGET_MINUTES: ${{ github.event.inputs.scrape_budget_minutes || '150' }}
          SCRAPE_MAX_POSTS: ${{ github.event.inputs.scrape_max_posts || '' }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > service_account.json
          python -u run_daily_sync.py

      - name: Save Refunnel session for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-export-emails-${{ matrix.workspace.name }}-${{ github.run_id }}
          path: downloads/
          retention-days: 7
          if-no-files-found: ignore

  # --- Phases 2 + 4: campaign tagging, then Approved videos to Drive ---
  # One job, because both of these scripts iterate every brand in
  # config/workspaces.yaml themselves. `if: always()` so a failure in an
  # earlier phase never silently cancels these.
  campaigns-and-drive:
    needs: export-and-emails
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium

      - name: Restore saved Refunnel session
        uses: actions/cache/restore@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}
          restore-keys: |
            refunnel-session-

      - name: Write service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > service_account.json

      - name: "Phase 2 - Tag posts with their campaign"
        if: always()
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPREADSHEET_ID_DUDEROBE: ${{ secrets.SPREADSHEET_ID_DUDEROBE }}
          SPREADSHEET_ID_SWOVERALLS: ${{ secrets.SPREADSHEET_ID_SWOVERALLS }}
          SPREADSHEET_ID_DEFI_SNACKS: ${{ secrets.SPREADSHEET_ID_DEFI_SNACKS }}
          SPREADSHEET_ID_KELSON: ${{ secrets.SPREADSHEET_ID_KELSON }}
        run: python -u sync_campaigns.py

      - name: "Phase 4 - Save Approved videos to Google Drive"
        if: always()
        env:
          REFUNNEL_EMAIL: ${{ secrets.REFUNNEL_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SPREADSHEET_ID_DUDEROBE: ${{ secrets.SPREADSHEET_ID_DUDEROBE }}
          SPREADSHEET_ID_SWOVERALLS: ${{ secrets.SPREADSHEET_ID_SWOVERALLS }}
          DRIVE_FOLDER_ID_SWOVERALLS: ${{ secrets.DRIVE_FOLDER_ID_SWOVERALLS }}
          DRIVE_BACKFILL_BATCH_SIZE: ${{ github.event.inputs.drive_batch_size || '50' }}
        run: python -u download_approved_to_drive.py

      - name: Save Refunnel session for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: refunnel_session.json
          key: refunnel-session-${{ github.run_id }}-phase24

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-campaigns-drive-${{ github.run_id }}
          path: downloads/
          retention-days: 7
          if-no-files-found: ignore
